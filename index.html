<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DayFlow</title>
<meta name="description" content="A calm, personal day planner." />
<meta name="theme-color" content="#050F14" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Loading screen: shown until the first screen is drawn, then fades away (see js/app.js). -->
  <div id="splash" aria-hidden="true">
    <svg class="splash-mark" viewBox="0 0 512 512" width="132" height="132">
      <defs><linearGradient id="sp-orb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9E6F4"/><stop offset="1" stop-color="#3492AB"/></linearGradient></defs>
      <g fill="none" stroke-linecap="round" stroke-width="18">
        <circle class="sp-r1" cx="256" cy="256" r="164" stroke="#3492AB" stroke-dasharray="560 470" transform="rotate(-200 256 256)" opacity=".75"/>
        <circle class="sp-r2" cx="256" cy="256" r="116" stroke="#5CBED6" stroke-dasharray="410 320" transform="rotate(-20 256 256)"/>
        <circle class="sp-r3" cx="256" cy="256" r="68" stroke="#8FD8EA" stroke-dasharray="240 190" transform="rotate(150 256 256)"/>
      </g>
      <circle class="sp-dot" cx="256" cy="256" r="22" fill="url(#sp-orb)"/>
    </svg>
    <div class="splash-word">DayFlow</div>
  </div>
  <div id="app">
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div class="scroll-fade-top"></div>

    <header id="top-bar" class="top-bar">
      <span class="brand">DayFlow</span>
    </header>

    <main id="view" class="view" role="main"></main>

    <div class="nav-bar-wrap">
      <nav id="nav-bar" class="nav nav-bar" aria-label="Main navigation"></nav>
    </div>

    <button id="fab" class="fab" aria-label="Add" aria-haspopup="true">+</button>

    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    // Safety net: never leave the loading screen up if the app script fails to start.
    setTimeout(function () { var s = document.getElementById("splash"); if (s) s.remove(); }, 8000);
  </script>
</body>
</html>
